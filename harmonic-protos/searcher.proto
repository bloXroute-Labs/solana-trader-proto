syntax = "proto3";

package searcher;

option go_package = "github.com/bloXroute-Labs/solana-trader-proto/harmonic-go/searcher";

import "bundle.proto";

message SendBundleRequest {
  bundle.Bundle bundle = 1;
}

message SendBundleResponse {
  // Server-generated UUID for the bundle
  string uuid = 1;
}

service SearcherService {
  // Submit a bundle for inclusion in a block
  rpc SendBundle(SendBundleRequest) returns (SendBundleResponse) {}
}
