syntax = "proto3";

package harmonic.packet;

option go_package = "github.com/bloXroute-Labs/solana-trader-proto/harmonic-go/packet";

message Packet {
  bytes data = 1;
  Meta meta = 2;
}

message Meta {
  uint64 size = 1;
  string addr = 2;
  uint32 port = 3;
  Flags flags = 4;
  uint64 sender_stake = 5;
}

message Flags {
  bool discard = 1;
  bool forwarded = 2;
  bool repair = 3;
  bool simple_vote_tx = 4;
  bool tracer_packet = 5;
  bool from_staked_node = 6;
}
